name: OpsHR isolated Supabase replay
on:
  push:
    branches: ['staging/production-baseline']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  behavioral:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Run existing behavioral security regression tests
        run: node --test tests/central-rls.test.mjs
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: niz262025-hub/southerndotcom-website
          ref: 7822e95bb13f27b3e97b67c5004b04557585ea01
          path: central
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.54.11
      - name: Start disposable Supabase
        run: |
          mkdir -p "$RUNNER_TEMP/opshr-replay"
          cd "$RUNNER_TEMP/opshr-replay"
          supabase init
          supabase start
      - name: Replay dependencies and OpsHR
        shell: bash
        run: |
          set -euo pipefail
          export PGHOST=127.0.0.1 PGPORT=54322 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=postgres
          for file in migrations/202610160001_myops_identity_foundation.sql migrations/20261101104802_central_trial_7_day_foundation.sql migrations/20261101164633_central_trial_usage_limits.sql migrations/20261118044103_myops_mobile_sso_tables.sql migrations/20261125124355_production_parity_profile_logo_policies.sql proposals/phase3_founders_100.sql proposals/202610170001_myops_app_access.sql proposals/202610170002_myops_login_sessions.sql migrations/20261125175729_production_parity_mobile_security_constraints.sql proposals/20261118044103_myops_mobile_sso_rpcs.sql migrations/20261125192226_central_browser_role_noncrud_hardening.sql migrations/20261125193036_central_service_role_noncrud_hardening.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "central/supabase/$file"
          done
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE opshr_app LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION NOINHERIT'
          for file in database/migrations/202611070001_employee_master.sql supabase/migrations/20261107174454_central_session_bridge.sql supabase/migrations/20261107180021_register_opshr_client.sql supabase/migrations/20261107181326_opshr_personal_workspace_release.sql supabase/migrations/20261107184134_opshr_free_trial_quota.sql supabase/migrations/202611260001_opshr_trial_quota_entitlement_hardening.sql; do
            echo "Replay: $file"
            psql -X -v ON_ERROR_STOP=1 -f "$file"
          done
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE t text; r text; p text; f text;
          BEGIN
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname='opshr_app' AND (rolsuper OR rolbypassrls OR rolcreatedb OR rolcreaterole OR rolreplication OR NOT rolcanlogin)) THEN RAISE EXCEPTION 'Unsafe app role'; END IF;
            IF EXISTS (SELECT 1 FROM pg_auth_members WHERE member='opshr_app'::regrole) THEN RAISE EXCEPTION 'Unexpected role membership'; END IF;
            FOREACH t IN ARRAY ARRAY['opshr_employees','opshr_identity_roles','trial_employee_creations'] LOOP
              IF NOT EXISTS (SELECT 1 FROM pg_class WHERE oid=to_regclass('opshr.'||t) AND relrowsecurity) THEN RAISE EXCEPTION 'Missing RLS %',t; END IF;
              FOREACH r IN ARRAY ARRAY['anon','authenticated','service_role'] LOOP
                FOREACH p IN ARRAY ARRAY['SELECT','INSERT','UPDATE','DELETE','TRUNCATE','REFERENCES','TRIGGER'] LOOP
                  IF has_table_privilege(r,'opshr.'||t,p) THEN RAISE EXCEPTION 'Unexpected ACL % % %',r,t,p; END IF;
                END LOOP;
              END LOOP;
            END LOOP;
            IF NOT (SELECT relforcerowsecurity FROM pg_class WHERE oid='opshr.opshr_employees'::regclass) THEN RAISE EXCEPTION 'Missing forced RLS'; END IF;
            FOREACH t IN ARRAY ARRAY['opshr_identity_roles','trial_employee_creations'] LOOP
              FOREACH p IN ARRAY ARRAY['SELECT','INSERT','UPDATE','DELETE','TRUNCATE','REFERENCES','TRIGGER'] LOOP
                IF has_table_privilege('opshr_app','opshr.'||t,p) THEN RAISE EXCEPTION 'Private table access % %',t,p; END IF;
              END LOOP;
            END LOOP;
            FOREACH f IN ARRAY ARRAY['resolve_central_actor(uuid,text)','opshr_current_hr_member(text)','end_central_login(uuid,text)','active_trial(uuid,text)','enforce_employee_trial_limit()'] LOOP
              FOREACH r IN ARRAY ARRAY['anon','authenticated','service_role'] LOOP
                IF has_function_privilege(r,'opshr.'||f,'EXECUTE') THEN RAISE EXCEPTION 'Unexpected RPC ACL % %',r,f; END IF;
              END LOOP;
              IF has_function_privilege('opshr_app','opshr.'||f,'EXECUTE') <> (f IN ('resolve_central_actor(uuid,text)','opshr_current_hr_member(text)','end_central_login(uuid,text)')) THEN RAISE EXCEPTION 'App RPC ACL mismatch %',f; END IF;
            END LOOP;
            IF NOT EXISTS (SELECT 1 FROM pg_trigger WHERE tgrelid='opshr.opshr_employees'::regclass AND tgname='opshr_employee_trial_limit' AND tgenabled='O') THEN RAISE EXCEPTION 'Missing trial trigger'; END IF;
          END $$;
          BEGIN;
          SET LOCAL ROLE opshr_app;
          SELECT set_config('opshr.app_grant_active','true',true),set_config('opshr.organization_id','forged',true),set_config('opshr.identity_user_id','00000000-0000-0000-0000-000000000001',true),set_config('opshr.central_session_id','00000000-0000-0000-0000-000000000002',true),set_config('opshr.central_app_id','opshr',true);
          DO $$
          BEGIN
            IF opshr.opshr_current_hr_member('forged') IS TRUE THEN RAISE EXCEPTION 'Forged actor accepted'; END IF;
            IF EXISTS (SELECT 1 FROM opshr.resolve_central_actor('00000000-0000-0000-0000-000000000002','opshr')) THEN RAISE EXCEPTION 'Unknown session accepted'; END IF;
            IF opshr.end_central_login('00000000-0000-0000-0000-000000000002','opshr') IS DISTINCT FROM false THEN RAISE EXCEPTION 'Unknown logout accepted'; END IF;
            BEGIN
              INSERT INTO opshr.opshr_employees(organization_id,employee_code,full_name,work_email,department,position_title,start_date,employment_status) VALUES ('forged','E1','Test','test@example.invalid','Test','Test',current_date,'active');
              RAISE EXCEPTION 'Unauthorized insert accepted';
            EXCEPTION WHEN insufficient_privilege THEN NULL;
            END;
          END $$;
          ROLLBACK;
          SQL
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users(id,email) VALUES ('00000000-0000-4000-8000-000000000011','opshr-replay@example.invalid');
          INSERT INTO public.myops_profiles(user_id,account_type) VALUES ('00000000-0000-4000-8000-000000000011','personal') ON CONFLICT(user_id) DO UPDATE SET account_type='personal';
          INSERT INTO public.myops_products(slug,display_name,launch_status) VALUES ('opshr','OpsHR','live') ON CONFLICT(slug) DO UPDATE SET launch_status='live';
          INSERT INTO public.myops_app_clients(app_id,product_slug,public_key_current,enabled) VALUES ('opshr','opshr',E'-----BEGIN PUBLIC KEY-----\\nMCowBQYDK2VwAyEAg64zMyj3O8Mp5FrGNMWQ2pAh4l+lWWBy9vTaT3v3Re4=\\n-----END PUBLIC KEY-----',true) ON CONFLICT(app_id) DO UPDATE SET enabled=true;
          INSERT INTO public.myops_login_sessions(id,user_id) VALUES ('00000000-0000-4000-8000-000000000014','00000000-0000-4000-8000-000000000011');
          INSERT INTO public.myops_app_sessions(id,user_id,app_id,product_slug,login_session_id) VALUES ('00000000-0000-4000-8000-000000000015','00000000-0000-4000-8000-000000000011','opshr','opshr','00000000-0000-4000-8000-000000000014');
          INSERT INTO public.myops_trials(user_id,started_at,expires_at,status,policy_version) VALUES ('00000000-0000-4000-8000-000000000011',now(),now()+interval '168 hours','active',1) ON CONFLICT(user_id) DO UPDATE SET started_at=now(),expires_at=now()+interval '168 hours',status='active';
          SQL
          context="SET ROLE opshr_app; SET opshr.identity_user_id='00000000-0000-4000-8000-000000000011'; SET opshr.organization_id='personal:00000000-0000-4000-8000-000000000011'; SET opshr.central_session_id='00000000-0000-4000-8000-000000000015'; SET opshr.central_app_id='opshr'; SET opshr.app_grant_active='true';"
          insert_employee() {
            psql -X -v ON_ERROR_STOP=1 -c "$context INSERT INTO opshr.opshr_employees(organization_id,employee_code,full_name,work_email,department,position_title,start_date,employment_status) VALUES ('personal:00000000-0000-4000-8000-000000000011','$1','Synthetic','$1@example.invalid','Test','Test',current_date,'active');"
          }
          for i in $(seq 1 29); do insert_employee "trial-$i"; done
          set +e
          insert_employee concurrent-a >"$RUNNER_TEMP/quota-a.log" 2>&1 & a=$!
          insert_employee concurrent-b >"$RUNNER_TEMP/quota-b.log" 2>&1 & b=$!
          wait "$a"; ra=$?
          wait "$b"; rb=$?
          set -e
          cat "$RUNNER_TEMP/quota-a.log" "$RUNNER_TEMP/quota-b.log"
          if ! { [[ "$ra" == 0 && "$rb" != 0 ]] || [[ "$rb" == 0 && "$ra" != 0 ]]; }; then exit 1; fi
          grep -q 'OpsHR trial employee limit reached' "$RUNNER_TEMP/quota-a.log" "$RUNNER_TEMP/quota-b.log"
          test "$(psql -X -Atc "SELECT count(*) FROM opshr.opshr_employees WHERE organization_id='personal:00000000-0000-4000-8000-000000000011'")" = 30
          psql -X -v ON_ERROR_STOP=1 -c "$context DELETE FROM opshr.opshr_employees WHERE employee_code='trial-1';"
          if insert_employee recreate >"$RUNNER_TEMP/recreate.log" 2>&1; then echo 'Quota reset bypass'; exit 1; fi
          grep -q 'OpsHR trial employee limit reached' "$RUNNER_TEMP/recreate.log"
          psql -X -v ON_ERROR_STOP=1 -c "INSERT INTO opshr.opshr_identity_roles(identity_user_id,organization_id,role,active) VALUES ('00000000-0000-4000-8000-000000000011','personal:00000000-0000-4000-8000-000000000011','hr_admin',true);"
          if insert_employee admin-bypass >"$RUNNER_TEMP/admin-bypass.log" 2>&1; then echo 'Local HR admin quota bypass'; exit 1; fi
          grep -q 'OpsHR trial employee limit reached' "$RUNNER_TEMP/admin-bypass.log"
          psql -X -v ON_ERROR_STOP=1 -c "INSERT INTO public.myops_subscriptions(personal_user_id,product_slug,status) VALUES ('00000000-0000-4000-8000-000000000011','opsfinance','active');"
          if insert_employee cross-app-bypass >"$RUNNER_TEMP/cross-app.log" 2>&1; then echo 'Cross-app quota bypass'; exit 1; fi
          grep -q 'OpsHR trial employee limit reached' "$RUNNER_TEMP/cross-app.log"
      - name: Stop disposable Supabase
        if: always()
        run: |
          cd "$RUNNER_TEMP/opshr-replay"
          supabase stop --no-backup
